[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fatchin"
version = "0.1.0"
description = "Self-hosted GitHub review fleet with a human merge gate"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "FatChin contributors"}]
keywords = ["github", "code-review", "agent", "automation", "self-hosted"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
fatchin = "ghagent.cli:main"
fatchin-web = "ghagent.web:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ghagent*"]
