[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "fatchin"
dynamic = ["version"]
description = "Self-hosted GitHub review fleet with a human merge gate"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "FatChin contributors"}]
keywords = ["github", "code-review", "agent", "automation", "self-hosted"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fatchin = "ghagent.cli:main"
fatchin-web = "ghagent.web:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ghagent*"]

[tool.setuptools.data-files]
"share/fatchin/web" = ["web/*.html", "web/*.js", "web/*.css", "web/*.svg", "web/*.png", "web/*.ico", "web/*.webmanifest"]
"share/fatchin/web/fonts" = ["web/fonts/*.ttf", "web/fonts/*LICENSE*"]
"share/fatchin/web/brand" = ["web/brand/*.png"]
"share/fatchin/docs" = ["docs/*.md"]

[tool.setuptools.dynamic]
version = {attr = "ghagent.__version__"}
