name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: ubuntu-26.04
            python-version: "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: Verify bubblewrap
        run: bwrap --die-with-parent --unshare-all --ro-bind / / -- /bin/true
      - name: Run the offline suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -t .

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          check-latest: true
      - name: Install the pinned build backend
        run: python -m pip install "setuptools==84.2.1"
      - name: Install the package without isolation
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Confirm the entry points
        run: |
          fatchin --help > /dev/null
          fatchin-web --help > /dev/null
